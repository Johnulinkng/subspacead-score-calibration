[project]
name = "industrial-anomaly-lab"
version = "0.1.0"
description = "Auditable reproduction and improvement of industrial anomaly detection baselines"
requires-python = ">=3.11,<3.12"
dependencies = [
    "imgaug==0.4.0",
    "matplotlib==3.10.1",
    "numpy==1.26.4",
    "pillow==11.1.0",
    "pyyaml==6.0.2",
    "scikit-image==0.25.2",
    "scikit-learn==1.6.1",
    "scipy==1.15.2",
    "shapely==2.0.7",
    "tensorboard==2.19.0",
    "torch==2.7.0",
    "torchvision==0.22.0",
    "tqdm==4.67.1",
]

[dependency-groups]
dev = [
    "gdown==5.2.0",
    "pytest==8.3.5",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
